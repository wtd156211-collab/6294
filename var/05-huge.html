<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>轴刻度核对 step=1e11 count=7</title>
<style>
body { font-family: monospace; margin: 24px; color: #222; }
#axis-summary { font-size: 16px; font-weight: bold; }
#overlap-note { margin: 6px 0 16px; }
#axis-chart { display: block; overflow: visible; }
.axis-line { stroke: #333; stroke-width: 1.5; }
.tick-line { stroke: #333; stroke-width: 1; }
.label-box { fill: #f6f6f6; stroke: #bbb; stroke-width: 0.5; }
.tick-label { font-family: monospace; font-size: 14px; fill: #222; }
.tick.overlap .label-box { fill: #ffdada; stroke: #c00000; }
.tick.overlap .tick-label { fill: #c00000; }
#ticks { background: #f6f6f6; padding: 12px; }
</style>
</head>
<body>
<header id="axis-summary">step=1e11 count=7 axis=480格 模式=科学计数法</header>
<p id="overlap-note">相邻标签重叠 0 处</p>
<svg id="axis-chart" width="4880" height="110" viewBox="-40 0 4880 110" role="img" aria-label="坐标轴刻度">
<line class="axis-line" x1="0" y1="30" x2="4800" y2="30"/>
<line class="tick-line" x1="0" y1="25" x2="0" y2="35"/>
<line class="tick-line" x1="800" y1="25" x2="800" y2="35"/>
<line class="tick-line" x1="1600" y1="25" x2="1600" y2="35"/>
<line class="tick-line" x1="2400" y1="25" x2="2400" y2="35"/>
<line class="tick-line" x1="3200" y1="25" x2="3200" y2="35"/>
<line class="tick-line" x1="4000" y1="25" x2="4000" y2="35"/>
<line class="tick-line" x1="4800" y1="25" x2="4800" y2="35"/>
<g class="tick" data-x0="-20.0000" data-x1="20.0000"><rect class="label-box" x="-20.0000" y="42" width="40" height="22"/><text class="tick-label" x="0.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">3e11</text></g>
<g class="tick" data-x0="780.0000" data-x1="820.0000"><rect class="label-box" x="780.0000" y="42" width="40" height="22"/><text class="tick-label" x="800.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">4e11</text></g>
<g class="tick" data-x0="1580.0000" data-x1="1620.0000"><rect class="label-box" x="1580.0000" y="42" width="40" height="22"/><text class="tick-label" x="1600.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">5e11</text></g>
<g class="tick" data-x0="2380.0000" data-x1="2420.0000"><rect class="label-box" x="2380.0000" y="42" width="40" height="22"/><text class="tick-label" x="2400.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">6e11</text></g>
<g class="tick" data-x0="3180.0000" data-x1="3220.0000"><rect class="label-box" x="3180.0000" y="42" width="40" height="22"/><text class="tick-label" x="3200.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">7e11</text></g>
<g class="tick" data-x0="3980.0000" data-x1="4020.0000"><rect class="label-box" x="3980.0000" y="42" width="40" height="22"/><text class="tick-label" x="4000.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">8e11</text></g>
<g class="tick" data-x0="4780.0000" data-x1="4820.0000"><rect class="label-box" x="4780.0000" y="42" width="40" height="22"/><text class="tick-label" x="4800.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">9e11</text></g>
</svg>
<pre id="ticks">300000000000 3e11
400000000000 4e11
500000000000 5e11
600000000000 6e11
700000000000 7e11
800000000000 8e11
900000000000 9e11
</pre>
<script type="module">
const groups = [...document.querySelectorAll("#axis-chart g.tick")];
let overlaps = 0;
for (let i = 0; i + 1 < groups.length; i += 1) {
  const left = groups[i], right = groups[i + 1];
  if (Number(left.dataset.x1) > Number(right.dataset.x0)) {
    left.classList.add("overlap");
    right.classList.add("overlap");
    overlaps += 1;
  }
}
document.getElementById("overlap-note").textContent =
  `相邻标签重叠 ${overlaps} 处${overlaps ? "（已标红）" : ""}`;
</script>
</body>
</html>
