<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>轴刻度核对 step=100 count=9</title>
<style>
body { font-family: monospace; margin: 24px; color: #222; }
#axis-summary { font-size: 16px; font-weight: bold; }
#overlap-note { margin: 6px 0 16px; }
#axis-chart { display: block; overflow: visible; }
.axis-line { stroke: #333; stroke-width: 1.5; }
.tick-line { stroke: #333; stroke-width: 1; }
.label-box { fill: #f6f6f6; stroke: #bbb; stroke-width: 0.5; }
.tick-label { font-family: monospace; font-size: 14px; fill: #222; }
.tick.overlap .label-box { fill: #ffdada; stroke: #c00000; }
.tick.overlap .tick-label { fill: #c00000; }
#ticks { background: #f6f6f6; padding: 12px; }
</style>
</head>
<body>
<header id="axis-summary">step=100 count=9 axis=360格 模式=定点</header>
<p id="overlap-note">相邻标签重叠 0 处</p>
<svg id="axis-chart" width="3680" height="110" viewBox="-40 0 3680 110" role="img" aria-label="坐标轴刻度">
<line class="axis-line" x1="0" y1="30" x2="3600" y2="30"/>
<line class="tick-line" x1="0" y1="25" x2="0" y2="35"/>
<line class="tick-line" x1="450" y1="25" x2="450" y2="35"/>
<line class="tick-line" x1="900" y1="25" x2="900" y2="35"/>
<line class="tick-line" x1="1350" y1="25" x2="1350" y2="35"/>
<line class="tick-line" x1="1800" y1="25" x2="1800" y2="35"/>
<line class="tick-line" x1="2250" y1="25" x2="2250" y2="35"/>
<line class="tick-line" x1="2700" y1="25" x2="2700" y2="35"/>
<line class="tick-line" x1="3150" y1="25" x2="3150" y2="35"/>
<line class="tick-line" x1="3600" y1="25" x2="3600" y2="35"/>
<g class="tick" data-x0="-20.0000" data-x1="20.0000"><rect class="label-box" x="-20.0000" y="42" width="40" height="22"/><text class="tick-label" x="0.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">-900</text></g>
<g class="tick" data-x0="430.0000" data-x1="470.0000"><rect class="label-box" x="430.0000" y="42" width="40" height="22"/><text class="tick-label" x="450.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">-800</text></g>
<g class="tick" data-x0="880.0000" data-x1="920.0000"><rect class="label-box" x="880.0000" y="42" width="40" height="22"/><text class="tick-label" x="900.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">-700</text></g>
<g class="tick" data-x0="1330.0000" data-x1="1370.0000"><rect class="label-box" x="1330.0000" y="42" width="40" height="22"/><text class="tick-label" x="1350.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">-600</text></g>
<g class="tick" data-x0="1780.0000" data-x1="1820.0000"><rect class="label-box" x="1780.0000" y="42" width="40" height="22"/><text class="tick-label" x="1800.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">-500</text></g>
<g class="tick" data-x0="2230.0000" data-x1="2270.0000"><rect class="label-box" x="2230.0000" y="42" width="40" height="22"/><text class="tick-label" x="2250.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">-400</text></g>
<g class="tick" data-x0="2680.0000" data-x1="2720.0000"><rect class="label-box" x="2680.0000" y="42" width="40" height="22"/><text class="tick-label" x="2700.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">-300</text></g>
<g class="tick" data-x0="3130.0000" data-x1="3170.0000"><rect class="label-box" x="3130.0000" y="42" width="40" height="22"/><text class="tick-label" x="3150.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">-200</text></g>
<g class="tick" data-x0="3580.0000" data-x1="3620.0000"><rect class="label-box" x="3580.0000" y="42" width="40" height="22"/><text class="tick-label" x="3600.0000" y="57" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">-100</text></g>
</svg>
<pre id="ticks">-900 -900
-800 -800
-700 -700
-600 -600
-500 -500
-400 -400
-300 -300
-200 -200
-100 -100
</pre>
<script type="module">
const groups = [...document.querySelectorAll("#axis-chart g.tick")];
let overlaps = 0;
for (let i = 0; i + 1 < groups.length; i += 1) {
  const left = groups[i], right = groups[i + 1];
  if (Number(left.dataset.x1) > Number(right.dataset.x0)) {
    left.classList.add("overlap");
    right.classList.add("overlap");
    overlaps += 1;
  }
}
document.getElementById("overlap-note").textContent =
  `相邻标签重叠 ${overlaps} 处${overlaps ? "（已标红）" : ""}`;
</script>
</body>
</html>
